name: Sync from Gitee

on:
  workflow_dispatch:        # 允许手动触发
  schedule:
    - cron: '0 */6 * * *'   # 可选：每 6 小时自动同步一次

permissions:
  contents: write           # 必须添加，否则无法推送到 GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 配置 SSH 私钥，并信任 Gitee 主机
      - name: Setup SSH for Gitee
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts 2>/dev/null

      # 2. 从 Gitee 克隆仓库到本地 repo 目录
      - name: Clone Gitee Repository
        run: |
          git clone git@gitee.com:liuliliuliliuli/deepin-cups.git repo
          cd repo
          git checkout master

      # 3. 将代码强制推送到当前 GitHub 仓库
      - name: Push to GitHub
        run: |
          cd repo
          git remote add github https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push github master --force
